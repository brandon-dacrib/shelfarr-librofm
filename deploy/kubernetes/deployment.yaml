apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfarr-librofm
  namespace: doris
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shelfarr-librofm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shelfarr-librofm
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shelfarr-librofm
          image: ghcr.io/brandon-dacrib/shelfarr-librofm:v0.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: LIBROFM_USERNAME
              valueFrom: {secretKeyRef: {name: shelfarr-librofm, key: username}}
            - name: LIBROFM_PASSWORD
              valueFrom: {secretKeyRef: {name: shelfarr-librofm, key: password}}
            - name: DOWNLOAD_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: shelfarr-librofm, key: download-signing-key}}
            - name: PROVIDER_BEARER_TOKEN
              valueFrom: {secretKeyRef: {name: shelfarr-librofm, key: provider-bearer-token}}
            - name: PUBLIC_BASE_URL
              value: http://shelfarr-librofm:8080
            - name: STATE_DIR
              value: /state
            - name: SYNC_INTERVAL
              value: 24h
            - name: MANUAL_SYNC_MIN_INTERVAL
              value: 6h
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          livenessProbe: {httpGet: {path: /health, port: http}}
          readinessProbe: {httpGet: {path: /health, port: http}}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: shelfarr-librofm-state
---
apiVersion: v1
kind: Service
metadata:
  name: shelfarr-librofm
  namespace: doris
spec:
  selector:
    app.kubernetes.io/name: shelfarr-librofm
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelfarr-librofm-state
  namespace: doris
  labels:
    app.kubernetes.io/name: shelfarr-librofm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
